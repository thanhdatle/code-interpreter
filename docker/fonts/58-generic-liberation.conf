<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Generic families must resolve to faces that are metric-compatible with
       the Word defaults (Times New Roman / Arial / Courier New). 60-latin.conf
       otherwise resolves them to DejaVu, whose metrics differ, which changes
       line breaking and page count against the original document.

       <prefer> reorders, it does not remove: DejaVu stays in the chain as the
       wide-coverage glyph fallback for characters Liberation lacks. The prefix
       must sort below 60 so this rule is applied before 60-latin.conf prepends
       its own list. -->
  <alias>
    <family>serif</family>
    <prefer><family>Liberation Serif</family></prefer>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>Liberation Mono</family></prefer>
  </alias>
</fontconfig>
